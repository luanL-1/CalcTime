<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calc Time</title>

    <style>
        body {
            background: #0d1117;
            color: #e6e6e6;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 10px;
        }

        h1 {
            color: #4da3ff;
            margin-bottom: 15px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            max-width: 900px;
            margin: auto;
        }

        .item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #1f2937;
            padding: 25px;
            border-radius: 12px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.4);
        }

        label {
            color: #cfcfcf;
        }

        input[type="number"] {
            width: 60px;
            padding: 8px;
            margin: 6px 2px;
            color: #fff;
            background: #111827;
            border: 1px solid #4da3ff55;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #4da3ff;
            box-shadow: 0 0 8px #4da3ff77;
        }

        input[type="submit"] {
            margin-top: 10px;
            padding: 10px 18px;
            background: #4da3ff33;
            border: 1px solid #4da3ff88;
            color: #fff;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.25s;
        }

        input[type="submit"]:hover {
            background: #4da3ff55;
            box-shadow: 0 0 10px #4da3ff77;
        }

        .acoes {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn-acao {
            padding: 8px 12px;
            background: #4da3ff22;
            border: 1px solid #4da3ff66;
            color: #fff;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.25s;
        }

        .btn-acao:hover {
            background: #4da3ff44;
            box-shadow: 0 0 8px #4da3ff55;
        }

        .btn-somar {
            font-size: 20px;
            font-weight: bold;
            padding: 3px 14px;
        }

        #resultado_dif,
        #resultado_des {
            margin-top: 12px;
            font-size: 18px;
            color: #9ecbff;
        }

        #acumulado_dif {
            margin-top: 8px;
            font-size: 14px;
            color: #8b949e;
            min-height: 18px;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- DIFERENÇA DE TEMPO -->
    <div class="item">

        <h1>Calculadora de Diferença de Tempo</h1>

        <form id="diferenca_tempo">

            <label>Hora de início:</label><br>

            <input
                type="number"
                id="hora_inicio_horas_dif"
                min="0"
                max="23"
                placeholder="HH"
                required
            > :

            <input
                type="number"
                id="hora_inicio_minutos_dif"
                min="0"
                max="59"
                placeholder="MM"
                required
            >

            <br><br>

            <label>Hora Final:</label><br>

            <input
                type="number"
                id="hora_fim_horas_dif"
                min="0"
                max="23"
                placeholder="HH"
                required
            > :

            <input
                type="number"
                id="hora_fim_minutos_dif"
                min="0"
                max="59"
                placeholder="MM"
                required
            >

            <br><br>

            <input
                type="submit"
                value="Calcular diferença de tempo"
            >

        </form>

        <div id="resultado_dif"></div>
        <div id="acumulado_dif"></div>

        <div class="acoes">

            <button
                type="button"
                class="btn-acao"
                onclick="copiarResultado('resultado_dif')"
            >
                📋 Copiar
            </button>

            <button
                type="button"
                class="btn-acao btn-somar"
                onclick="somarDiferenca()"
                title="Guardar resultado e fazer novo cálculo"
            >
                +
            </button>

            <button
                type="button"
                class="btn-acao"
                onclick="limparDiferenca()"
            >
                🧹 Limpar
            </button>

        </div>

    </div>


    <!-- DESCONTAR HORAS -->
    <div class="item">

        <h1>Descontar Horas</h1>

        <form id="diminuir_tempo">

            <label>Hora de início:</label><br>

            <input
                type="number"
                id="hora_inicio_horas_des"
                min="0"
                max="23"
                placeholder="HH"
                required
            > :

            <input
                type="number"
                id="hora_inicio_minutos_des"
                min="0"
                max="59"
                placeholder="MM"
                required
            >

            <br><br>

            <label>Minutos a diminuir:</label><br>

            <input
                type="number"
                id="minutos_des"
                min="0"
                required
            >

            <br><br>

            <input
                type="submit"
                value="Diminuir horas"
            >

        </form>

        <div id="resultado_des"></div>

        <div class="acoes">

            <button
                type="button"
                class="btn-acao"
                onclick="copiarResultado('resultado_des')"
            >
                📋 Copiar
            </button>

            <button
                type="button"
                class="btn-acao"
                onclick="limparDesconto()"
            >
                🧹 Limpar
            </button>

        </div>

    </div>

</div>


<script>

    /*
    ==========================================================
    VARIÁVEIS DO ACUMULADOR
    ==========================================================
    */

    let acumuladoMinutos = 0;
    let ultimaDiferencaMinutos = null;


    /*
    ==========================================================
    FORMATAR MINUTOS COMO TEXTO
    ==========================================================
    */

    function formatarTempoTexto(totalMinutos) {

        const negativo = totalMinutos < 0;
        const total = Math.abs(totalMinutos);

        const horas = Math.floor(total / 60);
        const minutos = total % 60;

        return (
            (negativo ? "-" : "") +
            horas +
            (horas === 1 ? " hora e " : " horas e ") +
            minutos +
            (minutos === 1 ? " minuto" : " minutos")
        );
    }


    /*
    ==========================================================
    FORMATAR MINUTOS COMO HH:MM
    ==========================================================
    */

    function formatarHHMM(totalMinutos) {

        const negativo = totalMinutos < 0;
        const total = Math.abs(totalMinutos);

        const horas = Math.floor(total / 60);
        const minutos = total % 60;

        return (
            (negativo ? "-" : "") +
            horas.toString().padStart(2, "0") +
            ":" +
            minutos.toString().padStart(2, "0")
        );
    }


    /*
    ==========================================================
    CAMPOS DE HORÁRIO
    ==========================================================
    */

    document.querySelectorAll('input[type="number"]').forEach(function(input) {

        input.addEventListener('input', function () {

            if (
                this.placeholder === "HH" ||
                this.placeholder === "MM"
            ) {

                if (this.value.length >= 2) {

                    let next = this.nextElementSibling;

                    if (next && next.tagName === "INPUT") {
                        next.focus();
                    }
                }
            }
        });


        /*
        Colar horário no formato HH:MM
        */

        input.addEventListener('paste', function (event) {

            if (
                this.placeholder !== "HH" &&
                this.placeholder !== "MM"
            ) {
                return;
            }

            const pasteData =
                event.clipboardData.getData('text/plain');

            const splitData =
                pasteData.trim().split(':');


            if (splitData.length === 2) {

                const hours =
                    parseInt(splitData[0], 10);

                const minutes =
                    parseInt(splitData[1], 10);


                if (
                    !isNaN(hours) &&
                    !isNaN(minutes) &&
                    hours >= 0 &&
                    hours <= 23 &&
                    minutes >= 0 &&
                    minutes <= 59
                ) {

                    this.value =
                        hours.toString().padStart(2, '0');


                    let next =
                        this.nextElementSibling;


                    if (
                        next &&
                        next.tagName === "INPUT"
                    ) {

                        next.value =
                            minutes.toString().padStart(2, '0');

                        next.focus();
                    }


                    event.preventDefault();
                }
            }
        });

    });


    /*
    ==========================================================
    COPIAR RESULTADO
    ==========================================================
    */

    function copiarResultado(id) {

        const elemento =
            document.getElementById(id);

        const texto =
            elemento.innerText.trim();


        if (!texto) {
            return;
        }


        let totalMinutos = null;


        /*
        Na calculadora de diferença, copiamos o TOTAL:
        acumulado + cálculo atual.
        */

        if (id === "resultado_dif") {

            if (ultimaDiferencaMinutos === null) {
                return;
            }

            totalMinutos =
                acumuladoMinutos +
                ultimaDiferencaMinutos;

        }


        /*
        No desconto de horas, extrai o resultado exibido.
        */

        else {

            const match = texto.match(
                /(-?\d+)\s*horas?\s*e\s*(-?\d+)\s*minutos?/i
            );

            if (!match) {
                return;
            }

            const horas =
                parseInt(match[1], 10);

            const minutos =
                parseInt(match[2], 10);

            totalMinutos =
                (horas * 60) +
                minutos;
        }


        const textoCopiar =
            formatarHHMM(totalMinutos);


        navigator.clipboard
            .writeText(textoCopiar)
            .then(function () {

                const original =
                    elemento.innerText;

                elemento.innerText =
                    original +
                    "  ✓ Copiado: " +
                    textoCopiar;


                setTimeout(function () {

                    elemento.innerText =
                        original;

                }, 1200);

            });
    }


    /*
    ==========================================================
    BOTÃO +
    GUARDA RESULTADO ATUAL NO ACUMULADOR
    ==========================================================
    */

    function somarDiferenca() {

        /*
        Só permite somar depois de realizar um cálculo.
        */

        if (ultimaDiferencaMinutos === null) {
            return;
        }


        /*
        Adiciona somente o cálculo atual ao acumulado.
        */

        acumuladoMinutos +=
            ultimaDiferencaMinutos;


        /*
        O cálculo atual já foi incorporado.
        */

        ultimaDiferencaMinutos = null;


        /*
        Limpa somente os campos.
        O acumulado permanece.
        */

        document
            .getElementById("diferenca_tempo")
            .reset();


        document
            .getElementById("resultado_dif")
            .innerText = "";


        document
            .getElementById("acumulado_dif")
            .innerText =
            "Acumulado: " +
            formatarHHMM(acumuladoMinutos);


        document
            .getElementById("hora_inicio_horas_dif")
            .focus();
    }


    /*
    ==========================================================
    LIMPAR DIFERENÇA
    ==========================================================
    */

    function limparDiferenca() {

        document
            .getElementById("diferenca_tempo")
            .reset();


        document
            .getElementById("resultado_dif")
            .innerText = "";


        document
            .getElementById("acumulado_dif")
            .innerText = "";


        /*
        Limpa também todo o acumulado.
        */

        acumuladoMinutos = 0;
        ultimaDiferencaMinutos = null;


        document
            .getElementById("hora_inicio_horas_dif")
            .focus();
    }


    /*
    ==========================================================
    LIMPAR DESCONTO
    ==========================================================
    */

    function limparDesconto() {

        document
            .getElementById("diminuir_tempo")
            .reset();


        document
            .getElementById("resultado_des")
            .innerText = "";


        document
            .getElementById("hora_inicio_horas_des")
            .focus();
    }


    /*
    ==========================================================
    CALCULAR DIFERENÇA
    ==========================================================
    */

    document
        .getElementById("diferenca_tempo")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const hiH =
                    parseInt(
                        document
                            .getElementById("hora_inicio_horas_dif")
                            .value,
                        10
                    );


                const hiM =
                    parseInt(
                        document
                            .getElementById("hora_inicio_minutos_dif")
                            .value,
                        10
                    );


                const hfH =
                    parseInt(
                        document
                            .getElementById("hora_fim_horas_dif")
                            .value,
                        10
                    );


                const hfM =
                    parseInt(
                        document
                            .getElementById("hora_fim_minutos_dif")
                            .value,
                        10
                    );


                const inicio =
                    (hiH * 60) + hiM;


                const fim =
                    (hfH * 60) + hfM;


                /*
                Diferença deste cálculo.
                */

                ultimaDiferencaMinutos =
                    fim - inicio;


                /*
                Soma com o que já estava acumulado.
                */

                const total =
                    acumuladoMinutos +
                    ultimaDiferencaMinutos;


                /*
                Se ainda não existe acumulado,
                mostra de forma normal.
                */

                if (acumuladoMinutos === 0) {

                    document
                        .getElementById("resultado_dif")
                        .innerText =
                        "Diferença de tempo: " +
                        formatarTempoTexto(
                            ultimaDiferencaMinutos
                        );

                }

                /*
                Se existe acumulado,
                mostra o total.
                */

                else {

                    document
                        .getElementById("resultado_dif")
                        .innerText =
                        "Total: " +
                        formatarTempoTexto(total);


                    document
                        .getElementById("acumulado_dif")
                        .innerText =
                        "Acumulado anterior: " +
                        formatarHHMM(acumuladoMinutos) +
                        " + Atual: " +
                        formatarHHMM(
                            ultimaDiferencaMinutos
                        );
                }

            }
        );


    /*
    ==========================================================
    DIMINUIR TEMPO
    ==========================================================
    */

    document
        .getElementById("diminuir_tempo")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const h =
                    parseInt(
                        document
                            .getElementById("hora_inicio_horas_des")
                            .value,
                        10
                    );


                const m =
                    parseInt(
                        document
                            .getElementById("hora_inicio_minutos_des")
                            .value,
                        10
                    );


                const sub =
                    parseInt(
                        document
                            .getElementById("minutos_des")
                            .value,
                        10
                    );


                let total =
                    (h * 60 + m) - sub;


                /*
                Ajusta passagem da meia-noite.
                Exemplo:
                00:20 - 30 = 23:50
                */

                total =
                    ((total % 1440) + 1440) % 1440;


                const hFinal =
                    Math.floor(total / 60);


                const mFinal =
                    total % 60;


                document
                    .getElementById("resultado_des")
                    .innerText =
                    "Resultado: " +
                    hFinal +
                    (hFinal === 1
                        ? " hora e "
                        : " horas e ") +
                    mFinal +
                    (mFinal === 1
                        ? " minuto."
                        : " minutos.");

            }
        );

</script>

</body>
</html>
